
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAssist AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #090711;
            color: #f5f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        .chatbox {
            background: #141120;
            border: 1px solid #352653;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 0 35px #7c3aed20;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            display: grid;
            place-items: center;
            font-size: 25px;
        }

        h1 {
            font-size: 23px;
            margin: 0 0 5px;
        }

        .subtitle {
            color: #a8a0bd;
            margin: 0;
            font-size: 13px;
        }

        .online {
            color: #86efac;
            font-size: 12px;
            margin-top: 8px;
        }

        .online span {
            color: #4ade80;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button, .history-btn {
            border: 1px solid #49366b;
            border-radius: 10px;
            padding: 10px 13px;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            color: #f5f3ff;
            background: #241b37;
        }

        button:hover, .history-btn:hover {
            background: #382451;
        }

        .clear-btn {
            color: #fda4af;
            border-color: #673044;
        }

        #messages {
            height: 390px;
            overflow-y: auto;
            padding: 18px 4px;
            margin: 22px 0 16px;
            border-top: 1px solid #302640;
            border-bottom: 1px solid #302640;
            scroll-behavior: smooth;
        }

        .message {
            padding: 13px 16px;
            margin: 12px 0;
            border-radius: 15px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .bot {
            background: #211a31;
            border: 1px solid #3b2b54;
            color: #eee8ff;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .user {
            background: linear-gradient(135deg, #7c3aed, #5b4bdb);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .sender {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            opacity: 0.75;
        }

        .welcome {
            text-align: center;
            color: #a8a0bd;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #49366b;
            border-radius: 12px;
            background: #0e0b17;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px #8b5cf620;
        }

        input::placeholder {
            color: #827793;
        }

        .send-btn {
            background: linear-gradient(135deg, #8b5cf6, #5b4bdb);
            border: none;
            padding: 0 22px;
            font-weight: bold;
        }

        .send-btn:hover {
            background: linear-gradient(135deg, #a78bfa, #7c6cf0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            min-height: 18px;
            color: #a8a0bd;
            font-size: 12px;
            margin-top: 12px;
        }

        .footer {
            text-align: center;
            color: #756b88;
            font-size: 11px;
            margin-top: 18px;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .chatbox {
                padding: 16px;
            }

            h1 {
                font-size: 19px;
            }

            #messages {
                height: 340px;
            }

            .message {
                max-width: 94%;
            }

            .send-btn {
                padding: 0 15px;
            }
        }
        
.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 18px;
}

.suggestions p {
    width: 100%;
    margin: 0;
    color: #a8a0bd;
    font-size: 12px;
}

.suggestion-btn {
    padding: 9px 12px;
    border-radius: 20px;
    background: #211a31;
    border: 1px solid #49366b;
    color: #d8b4fe;
    font-size: 12px;
}

.suggestion-btn:hover {
    background: #382451;
}

    </style>
</head>

<body>
    <main class="container">
        <section class="chatbox">

            <header class="topbar">
                <div>
                    <div class="brand">
                        <div class="logo">🤖</div>
                        <div>
                            <h1>SmartAssist AI</h1>
                            <p class="subtitle">Your personal AI assistant</p>
                        </div>
                    </div>
                    <div class="online"><span>●</span> Assistant ready</div>
                </div>

                <div class="actions">
                    <a class="history-btn" href="/history">📚 History</a>
                    <button class="export-btn" id="export-chat" type="button">
    📥 Export Chat
</button>
                    <button class="clear-btn" id="clear-chat" type="button">
                        🗑 Clear Chat
                    </button>
                </div>
            </header>

            <div id="messages" aria-live="polite">
                <div class="message bot">
                    <span class="sender">SmartAssist AI</span>
                    Hello! 👋 Welcome to SmartAssist AI.
                    Ask me about Python, Flask, databases, or programming!
                </div>
            </div>
            
<div class="suggestions">
    <p>✨ Try asking:</p>
    <button type="button" class="suggestion-btn">What is Python?</button>
    <button type="button" class="suggestion-btn">What is Flask?</button>
    <button type="button" class="suggestion-btn">What is SQLite?</button>
</div>


            <div class="welcome">Ask a question to get started ✨</div>

            <form id="chat-form" class="controls">
                <input
                    id="message"
                    maxlength="1000"
                    placeholder="Message SmartAssist AI..."
                    autocomplete="off"
                    required
                >
                <button class="send-btn" id="send" type="submit">
                    Send ➤
                </button>
            </form>

            <div id="status" role="status"></div>
            <div class="footer">SmartAssist AI · Built with Python & Flask</div>
        </section>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");
        const status = document.getElementById("status");
        const send = document.getElementById("send");
        const clearButton = document.getElementById("clear-chat");
        
const exportButton = document.getElementById("export-chat");

exportButton.addEventListener("click", () => {
    const chatMessages = messages.querySelectorAll(".message");

    let chatText = "SmartAssist AI - Chat Export\n";
    chatText += "================================\n\n";

    chatMessages.forEach((msg) => {
        const sender = msg.querySelector(".sender");
        const name = sender ? sender.textContent : "Message";
        const content = Array.from(msg.childNodes)
            .filter(node => node.nodeType === Node.TEXT_NODE)
            .map(node => node.textContent.trim())
            .join(" ");

        chatText += name + ": " + content + "\n\n";
    });

    const blob = new Blob([chatText], {
        type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "SmartAssist_Chat.txt";
    link.click();

    URL.revokeObjectURL(url);
    status.textContent = "Chat exported successfully!";
});

        
document.querySelectorAll(".suggestion-btn").forEach((button) => {
    button.addEventListener("click", () => {
        input.value = button.textContent;
        form.requestSubmit();
    });
});


        const welcomeMessage = `
            <span class="sender">SmartAssist AI</span>
            Hello! 👋 Welcome to SmartAssist AI.
            Ask me about Python, Flask, databases, or programming!
        `;

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;

            const sender = document.createElement("span");
            sender.className = "sender";
            sender.textContent = type === "user" ? "You" : "SmartAssist AI";

            div.appendChild(sender);
            div.appendChild(document.createTextNode(text));
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        clearButton.addEventListener("click", () => {
            messages.replaceChildren();

            const welcome = document.createElement("div");
            welcome.className = "message bot";
            welcome.innerHTML = welcomeMessage;
            messages.appendChild(welcome);

            status.textContent = "Current chat cleared. Saved history is unchanged.";
            input.focus();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            send.disabled = true;
            status.textContent = "SmartAssist is thinking...";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message})
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed.");
                }

                addMessage(data.reply, "bot");
                status.textContent = "Reply received successfully.";
            } catch (error) {
                status.textContent = "Error: " + error.message;
            } finally {
                send.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
